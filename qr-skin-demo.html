<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR 주문 스킨 · 실시간 미리보기 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    /* 기본 목업(customer.html) 디자인 토큰 */
    --ink:#191f28; --ink2:#4e5968; --ink3:#8b95a1; --ink4:#b0b8c1;
    --line:#e5e8eb; --line2:#f1f3f5; --bg:#f2f4f6; --card:#fff;
    --green:#64C8BE; --red:#e03131; --amber:#f59f00;
    --brandUI:#5C8CDA;               /* 빌더 UI 강조색 */
    --accent:#5C8CDA; --accent-soft:#eef4fd; --accent-ink:#fff;  /* 스킨 메인 컬러(가변) */
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px; margin:0 auto; padding:48px 24px 72px;}
  .eyebrow{display:inline-block; background:#e3e9ff; color:#3b5bdb; font-size:13px; font-weight:700;
    padding:6px 14px; border-radius:999px;}
  .hero{text-align:center; margin-bottom:40px;}
  .hero h1{font-size:34px; line-height:1.32; margin:18px 0 14px; letter-spacing:-.5px;}
  .hero p{color:var(--ink2); font-size:16px; line-height:1.6; margin:0;}

  .layout{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:36px; align-items:start;}
  @media(max-width:900px){.layout{grid-template-columns:1fr;} .phonewrap{order:-1;}}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px;}
  .panel-title{display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; margin:0 0 18px;}
  .panel-title .dot{width:20px;height:20px;border-radius:50%;background:var(--brandUI);
    display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}

  .presets{display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:8px;}
  .preset{border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; cursor:pointer;
    display:flex; gap:11px; align-items:center; transition:.15s; background:#fff;}
  .preset:hover{border-color:#c5cee0; background:#fafbff;}
  .preset.active{border-color:var(--brandUI); background:#f4f7ff; box-shadow:0 0 0 3px #e7eeff;}
  .preset .emoji{width:38px;height:38px;border-radius:10px;flex:none;display:flex;
    align-items:center;justify-content:center;font-size:20px;background:var(--bg);}
  .preset b{display:block; font-size:14.5px;}
  .preset span{display:block; font-size:11.5px; color:var(--ink3); margin-top:2px; line-height:1.3;}

  .opt-group{margin-bottom:20px;}
  .opt-label{font-size:12.5px; font-weight:700; color:var(--ink2); margin-bottom:9px;}
  .swatches{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid #fff;
    box-shadow:0 0 0 1.5px var(--line); transition:.12s;}
  .swatch.active{box-shadow:0 0 0 2.5px var(--brandUI); transform:scale(1.08);}
  .seg{display:grid; gap:8px;}
  .seg.cols-2{grid-template-columns:1fr 1fr;}
  .seg.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .seg button{border:1.5px solid var(--line); background:#fff; border-radius:11px; padding:13px 8px; cursor:pointer;
    font-size:12.5px; font-weight:600; color:var(--ink2); transition:.13s;
    display:flex; flex-direction:column; align-items:center; gap:7px; font-family:inherit;}
  .seg button:hover{border-color:#c5cee0;}
  .seg button.active{border-color:var(--brandUI); background:#f4f7ff; color:#1d4ed8;}
  .seg button svg{width:34px;height:22px;}
  .seg button .ic{stroke:#94a3b8;}
  .seg button.active .ic{stroke:var(--brandUI);}

  .combo-readout{background:var(--bg);border-radius:12px;padding:11px 13px;font-size:11.5px;
    color:var(--ink2);line-height:1.7;}
  .combo-readout b{color:var(--ink);}

  /* ===== 폰 미리보기 ===== */
  .phonewrap{position:sticky; top:24px; display:flex; flex-direction:column; align-items:center; gap:12px;}
  .phone{width:340px; height:710px; background:#000; border-radius:46px; padding:11px;
    box-shadow:0 30px 60px rgba(20,30,60,.28);}
  .screen{width:100%;height:100%;background:var(--card);border-radius:36px;overflow:hidden;position:relative;
    display:flex;flex-direction:column;}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:26px;
    background:#000;border-radius:0 0 16px 16px;z-index:60;}
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:11px 22px 5px;
    font-size:12px;font-weight:700;color:#111;flex:none;background:var(--card);}
  .scroll{flex:1; overflow-y:auto; position:relative; background:var(--bg); scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none;}
  .cap{font-size:12px;color:var(--ink3);}

  /* 커버 + 브랜드 헤더 */
  .cover{aspect-ratio:16/9;position:relative;overflow:hidden;}
  .cover .coverimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .brandinfo{padding:0 18px;position:relative;z-index:3;background:var(--card);}
  /* 배너형(실제 기획 동일): 정보영역 투명 + 커버 위로 32px 끌어올림, 로고만 커버에 걸침 */
  .brandinfo.banner{margin-top:-32px;background:transparent;}
  .brandinfo.basic{padding-top:18px;}
  .logo{width:72px;height:72px;border-radius:18px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid #fff;
    overflow:hidden;position:relative;}
  .logo .lemo{position:relative;z-index:0;}
  .logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;}
  .brow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:10px;}
  .bstore{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
  .histbtn{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;
    color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-soft);border-radius:20px;padding:7px 11px;}
  .histbtn .hist-cnt{background:var(--accent);color:#fff;min-width:17px;height:17px;border-radius:9px;
    display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;padding:0 4px;}
  .bintro{font-size:12.5px;color:var(--ink3);margin-top:9px;line-height:1.55;padding-bottom:14px;}

  /* 네이버 영수증 리뷰 배너 — 전 매장 공통 */
  .nrv-banner{display:flex;align-items:center;gap:9px;margin:0 14px;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:7px 12px;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .nrv-ico{width:21px;height:21px;border-radius:6px;background:#03C75A;color:#fff;font-weight:900;font-size:12.5px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nrv-tx{flex:1;font-size:12.5px;font-weight:700;color:var(--ink);}
  .nrv-arrow{font-size:15px;color:var(--ink4);}

  /* 메인 탭 */
  .maintabs{position:sticky;top:0;z-index:18;background:var(--card);display:flex;border-bottom:1px solid var(--line);margin-top:14px;}
  .maintab{flex:1;padding:13px 0;font-size:14px;font-weight:700;color:var(--ink3);background:none;border:none;
    border-bottom:3px solid transparent;text-align:center;font-family:inherit;}
  .maintab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:800;}

  /* 카테고리 — 가로 탭(칩) */
  .cattabs-wrap{position:sticky;top:46px;z-index:15;background:var(--card);border-bottom:1px solid var(--line);}
  .cattabs{display:flex;gap:7px;padding:11px 14px;overflow-x:auto;scrollbar-width:none;}
  .cattabs::-webkit-scrollbar{display:none;}
  .cattab-ic{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--bg);border:none;font-size:15px;
    display:flex;align-items:center;justify-content:center;color:var(--ink2);}
  .side .side-search{margin:4px auto 8px;}
  .cattab{flex-shrink:0;font-size:13.5px;font-weight:700;color:var(--ink3);padding:8px 14px;border-radius:20px;
    background:var(--bg);border:none;white-space:nowrap;font-family:inherit;}
  .cattab.on{background:var(--accent);color:#fff;font-weight:800;}

  /* 카테고리 — 세로 사이드 */
  .body{display:flex;background:var(--card);}
  .side{width:72px;flex:none;background:var(--bg);border-right:1px solid var(--line);padding:6px 0;}
  .side .t{margin:2px 6px;padding:11px 3px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink3);
    border-radius:8px;line-height:1.25;}
  .side .t.on{color:#fff;background:var(--accent);font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.12);}
  .menu-area{flex:1;min-width:0;}

  .catsec-h{padding:16px 16px 6px;font-size:15.5px;font-weight:800;color:var(--ink);background:var(--card);}

  /* 메뉴 카드 공통 */
  .cards{background:var(--card);}
  .mcard{display:flex;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line2);align-items:center;background:var(--card);}
  .mimg{width:90px;height:60px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:30px;}
  .mimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:block;}
  .mimg .emo{position:relative;z-index:0;}
  .img-badges{position:absolute;top:5px;left:5px;z-index:3;display:flex;flex-direction:column;gap:3px;}
  .img-badge{display:inline-flex;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;color:#fff;line-height:1.5;}
  .img-badge.hot{background:#e8590c;}
  .img-badge.reco{background:#f59f00;}
  .img-badge.new{background:#1971c2;}
  .minfo{flex:1;min-width:0;}
  .mname{font-size:15px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
  .mdesc{font-size:12px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mprice{font-size:15px;font-weight:800;margin-top:5px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;color:var(--ink);}
  .mprice .ori{font-size:11.5px;color:var(--ink4);font-weight:500;text-decoration:line-through;}
  .mprice .disc{color:var(--red);}
  .mplus{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;}

  /* 그리드형 */
  .cards.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px;}
  .cards.grid.one{grid-template-columns:1fr;}
  .cards.grid .mcard{display:block;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .cards.grid .mimg{width:100%;height:auto;aspect-ratio:6/4;border-radius:0;font-size:40px;}
  .cards.grid .minfo{padding:9px 11px 0;}
  .cards.grid .mname{white-space:normal;}
  .cards.grid .mdesc{display:none;}
  .cards.grid .gadd{display:block;margin:9px 11px 12px;border:none;border-radius:9px;background:var(--accent);color:#fff;
    font-size:12.5px;font-weight:800;padding:9px 0;text-align:center;font-family:inherit;width:calc(100% - 22px);}

  /* 텍스트형 — 이미지는 우측에 6:4 */
  .cards.text .mname{white-space:normal;font-size:15.5px;}
  .cards.text .mdesc{white-space:normal;font-size:12.5px;}
  .cards.text .mprice{flex-wrap:nowrap;font-size:16px;}
  .cards.text .mimg{width:96px;height:64px;font-size:26px;}
  /* 무이미지 메뉴: 썸네일 없이 텍스트(이름·설명·가격)가 영역을 채움 */
  .mcard.noimg .minfo{flex:1;}
  .cards.grid .mcard.noimg{padding:12px;}
  .cards.grid .mcard.noimg .mname{white-space:normal;}
  .cards.grid .mcard.noimg .mdesc{display:block;}

  /* 주문하기 바 (플로팅 와이드 바, 실제 목업과 동일) */
  .cartbar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 28px);z-index:40;}
  .cartbar-btn{width:100%;display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);
    border:none;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:800;font-family:inherit;box-shadow:0 8px 22px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.10);}
  .cartbar-btn .cnt{background:rgba(255,255,255,.28);min-width:22px;height:22px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px;}
  .cartbar-btn .cb-label{flex:1;text-align:left;padding-left:6px;}
  .cartbar-btn .cb-total{margin-left:auto;}

  /* 직원 호출 — 이자카야만, 주문 바 위 우측 */
    /* 주문하기 바 뒤 메뉴가 비쳐 색이 겹치는 것 방지하는 하단 페이드 */
  .floats-fade{position:absolute;left:0;right:0;bottom:0;height:112px;z-index:38;pointer-events:none;
    background:linear-gradient(to top, var(--card) 60%, rgba(255,255,255,0));}
  .staff-call{position:absolute;right:16px;bottom:74px;height:40px;padding:0 14px;border-radius:999px;background:#fff;
    border:1px solid var(--line);box-shadow:0 6px 16px rgba(0,0,0,.16);z-index:39;display:flex;align-items:center;gap:6px;
    font-size:12px;font-weight:800;color:var(--ink2);}

  .footer-chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:44px;}
  .fchip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;
    font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px;}
  .fchip svg{width:14px;height:14px;color:#22c55e;}
  /* 인터랙션: 토스트 · 탭 패널 · 누름 피드백 */
  .toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(6px);
    background:rgba(25,31,40,.92);color:#fff;font-size:12px;font-weight:700;padding:9px 14px;border-radius:999px;
    opacity:0;transition:.2s;z-index:50;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .panel-pad{padding:14px 16px;background:var(--card);min-height:220px;}
  .rv-card{border-bottom:1px solid var(--line2);padding:12px 0;}
  .rv-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink);}
  .rv-star{color:var(--amber);font-size:12px;}
  .rv-tx{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.5;}
  .info-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:13.5px;}
  .info-k{width:74px;color:var(--ink3);font-weight:700;flex:none;}
  .info-v{color:var(--ink);flex:1;line-height:1.5;}
  .cattab,.maintab,.cattab-ic,.sidecat,.mplus,.gadd,.cartbar-btn,.histbtn,.nrv-banner,.staff-call{cursor:pointer;transition:transform .08s,background .12s;}
  .cattab:active,.maintab:active,.sidecat:active,.mplus:active,.gadd:active,.cartbar-btn:active,.histbtn:active,.nrv-banner:active,.staff-call:active{transform:scale(.95);}
  /* 단일 스킨 미리보기 모드 (?skin=KEY) — 폰만 표시 */
  body.single{background:transparent;}
  body.single .hero,body.single .panel,body.single .footer-chips,body.single .cap{display:none!important;}
  body.single .wrap{padding:8px;max-width:none;}
  body.single .layout{display:flex;justify-content:center;}
  body.single .phonewrap{position:static;top:auto;}
  body.single .phone{box-shadow:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span class="eyebrow">QR 주문 스킨</span>
    <h1>우리 매장만의 주문 페이지를 만들어보세요.</h1>
    <p>가게 분위기에 어울리는 색상과 레이아웃을 직접 선택할 수 있어요.<br>
       손님들에게 우리 가게만의 특별한 감성을 전달해 보세요.</p>
  </div>

  <div class="layout">

    <div class="panel">
      <div class="opt-label">샘플 스킨을 선택해 보세요</div>
      <div class="presets" id="presets"></div>
    </div>

    <div class="phonewrap">
      <div class="phone"><div class="screen">
        <div class="notch"></div>
        <div class="statusbar"><span>9:41</span><span style="display:inline-flex;align-items:center;gap:6px"><svg width="18" height="11" viewBox="0 0 18 11" fill="#111"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="#111"><path d="M8 2.4c2.5 0 4.8 1 6.5 2.6l-1.4 1.5C11.8 5.2 10 4.4 8 4.4S4.2 5.2 2.9 6.5L1.5 5C3.2 3.4 5.5 2.4 8 2.4z"/><path d="M8 6.1c1.4 0 2.7.6 3.7 1.5l-1.5 1.5C9.6 8.5 8.8 8.1 8 8.1s-1.6.4-2.2 1L4.3 7.6C5.3 6.7 6.6 6.1 8 6.1z"/><circle cx="8" cy="10.4" r="1.2"/></svg><svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#111" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="9" rx="1.8" fill="#111"/><rect x="23.5" y="4" width="1.8" height="5" rx="0.9" fill="#111" fill-opacity="0.35"/></svg></span></div>
        <div class="scroll" id="screen"></div>
        <div id="floats"></div>
      </div></div>
      <div class="cap">실시간 미리보기 · 조작은 데모용입니다</div>
    </div>

  </div>

  <div class="footer-chips">
    <div class="fchip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg> 색상 테마 선택</div>
    <div class="fchip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg> 리스트·그리드 레이아웃</div>
    <div class="fchip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg> 헤더·커버 구성</div>
    <div class="fchip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg> 카테고리 순서 편집</div>
  </div>

</div>

<script>
"use strict";

var PALETTE = [
  {key:'pink',   c:'#ec4899', soft:'#fce7f1', ink:'#fff'},
  {key:'green',  c:'#10b981', soft:'#dcfce7', ink:'#fff'},
  {key:'blue',   c:'#5C8CDA', soft:'#eef4fd', ink:'#fff'},
  {key:'navy',   c:'#1f2a44', soft:'#e6e9f0', ink:'#fff'},
  {key:'orange', c:'#f97316', soft:'#ffedd5', ink:'#fff'},
  {key:'purple', c:'#8b5cf6', soft:'#ede9fe', ink:'#fff'},
  {key:'red',    c:'#ef4444', soft:'#fee2e2', ink:'#fff'},
  {key:'brown',  c:'#8a5a36', soft:'#f1e7df', ink:'#fff'}
];

/* 4개 업종 스킨 — 실제 옵션 조합 + 기본 목업 문구 규칙(원/인기·추천·NEW) */
var SKINS = {

function onScreenClick(e){
  var cat=e.target.closest('.cattab,.sidecat');
  if(cat){ var sibs=cat.parentElement.querySelectorAll('.cattab,.sidecat'); setOn(sibs,cat);
    var h=document.querySelector('#screen .catsec-h'); if(h)h.textContent=cat.textContent; return; }
  var mt=e.target.closest('.maintab');
  if(mt){ curTab=mt.getAttribute('data-tab'); drawScreen(); return; }
  var add=e.target.closest('.mplus,.gadd');
  if(add){ live.cnt++; live.total+=won(add.getAttribute('data-pr')); updateCartUI(); toast('\uc7a5\ubc14\uad6c\ub2c8\uc5d0 \ub2f4\uc558\uc5b4\uc694'); return; }
